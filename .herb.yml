# Configures Herb's linter, formatter and language server. Only the linter is
# gated by `bin/ci`; see the `Style: ERB` step in `config/ci.rb`.
#
# Docs: https://herb-tools.dev/configuration

# Locks the rule set to the rules that shipped in this release. A rule
# introduced later stays off until this number is bumped, which is the
# opposite of `.rubocop.yml`'s `NewCops: enable`. So bumping the package alone
# leaves new rules inactive: on a Dependabot pull request, run
# `node_modules/.bin/herb-lint --upgrade`, which raises this number and writes
# an explicit `enabled: false` for each newly arrived rule, then decide each of
# those on its own rather than leaving the whole batch off.
version: 0.11.0

# These templates are ActionView's, not plain ERB rendered by a script, so the
# `actionview-*` rules are reading the right dialect. Declarative only: the
# measurement behind this branch found the same 85 rules enabled and the same
# offenses under the `ruby` default.
framework: actionview

linter:
  enabled: true

  # Fail on anything the linter reports, down to `hint`, rather than on
  # `error` alone as the default does. `bin/rubocop` tolerates no offense
  # either, and at the default an `info` offense would leave the gate green
  # over a template the linter is complaining about.
  failLevel: hint

  rules:
    # Rails generates the static error pages under `public/`, and this rule
    # fires on each one for a missing space before `/>` inside a minified
    # inline `<svg>`. `--fix` corrects them, but no reader benefits and
    # `rails new` reintroduces it on the next framework upgrade, turning the
    # gate red for something nobody changed. Scoped to this one rule so the
    # other 84 keep running on pages users actually see.
    html-no-space-in-tag:
      exclude:
        - 'public/**/*'

    # `render @event` is the idiomatic Rails form: the record names its own
    # partial through `to_partial_path`. Spelling out `partial:` and `object:`
    # at every call site buys the linter a lookup it could make itself and
    # costs every reader the shorter line.
    actionview-no-implicit-partial:
      enabled: false

    # The groups index passes each card its own `membership`, looked up once
    # for the whole page so no card queries for it, and a collection render
    # cannot pass a per-item local. Scoped to that one file so the rule still
    # catches a loop that passes nothing per item.
    actionview-prefer-collection-render:
      exclude:
        - 'app/views/groups/index.html.erb'

    # A false positive: the rule fires on any `form_with` inside a
    # `render layout:` block, even with no `<form>` anywhere around it, and
    # the styleguide yields each section's form through `styleguides/section`
    # that way. Scoped to that one file so a real nested form still fails.
    html-no-nested-forms:
      exclude:
        - 'app/views/styleguides/show.html.erb'
