# Omakase Ruby styling for Rails
inherit_gem:
  rubocop-rails-omakase: rubocop.yml
  # Teaches RSpec/EmptyExampleGroup and friends about the action_policy RSpec
  # DSL (describe_rule/succeed/failed), so a policy spec is not flagged as empty.
  action_policy: config/rubocop-rspec.yml

plugins:
  - rubocop-rspec
  # The Capybara cops, which rubocop-rspec carried until its 3.0 and no longer does.
  - rubocop-capybara
  # The FactoryBot cops, which rubocop-rspec carried until its 3.0 and no longer does.
  - rubocop-factory_bot
  # Lints the Ruby code blocks in markdown files with the same cops as the code.
  - rubocop-md
  - rubocop-rake
  # The app runs under Puma's threads and Solid Queue's workers.
  - rubocop-thread_safety

# Merge rather than replace, so the exclusions below add to RuboCop's own
# defaults (`node_modules/`, `vendor/`, `tmp/`) instead of dropping them.
inherit_mode:
  merge:
    - Exclude

AllCops:
  NewCops: enable
  # `.agents/` and `.claude/` stay out: RuboCop skips hidden directories,
  # `.agents/` holds no Ruby blocks, `.claude/`'s markdown files are
  # symlinks into it, and `.claude/worktrees/` holds other branches'
  # checkouts.
  #
  # A plan is a dated record frozen at plan time, and its Ruby blocks are
  # often partial or illustrative, so rewriting one to satisfy a linter
  # changes the record without improving any code - #411. `CLAUDE.md` and
  # `GEMINI.md` are symlinks to `AGENTS.md`, which is linted itself, so
  # linting them would report each of its offenses three times.
  Exclude:
    - "docs/plans/**/*"
    - "CLAUDE.md"
    - "GEMINI.md"

# Overwrite or add rules to create your own house style
#
# # Use `[a, [b, c]]` not `[ a, [ b, c ] ]`
# Layout/SpaceInsideArrayLiteralBrackets:
#   Enabled: false

# An inline `rubocop:disable` is itself an offense, with no exceptions:
# the cop's own `AllowedCops` default is already `[]`, so enabling it
# catches every directive that leaves this cop unnamed. A directive that
# names this cop, its department, or `all` disables it along with
# whatever it was hiding, which is why `bin/rubocop` also passes
# `--ignore-disable-comments` - that flag, together with this cop, is
# the whole gate. A cop that is wrong for this repository is
# reconfigured here instead, once, with a comment saying why.
Style/DisableCopsWithinSourceCodeDirective:
  Enabled: true

# Inline setup is the rule in `.agents/testing.md`, so an example carries its
# own preconditions rather than hiding them in a `let`. Ten is the ceiling; an
# example longer than that is unacceptable.
RSpec/ExampleLength:
  Max: 10

# Action Policy's own alias matcher takes the rule name as the subject:
# `expect(:edit?).to be_an_alias_of(policy, :show?)`, per its testing guide. The
# cop reads that bare symbol as the expected value put in the wrong place, which
# is right in general and wrong for this matcher, whose signature has no other
# form. Scoped to policy specs so the cop keeps working everywhere else.
RSpec/ExpectActual:
  Exclude:
    - "spec/policies/**/*_spec.rb"

# These cops guard code that runs under Puma's threads and Solid Queue's
# workers. The spec process runs one example at a time, and a spec that
# mutates process-wide state on purpose, such as a callback set and
# removed around one request to reach a race window, is setup rather
# than a hazard - #411.
ThreadSafety:
  Exclude:
    - "spec/**/*"

# The group home's "caps the gig card's count at 99+" example needs 99
# real events, since the cap is reached through the count query and only
# rows prove the card uses it. A file is the narrowest scope config has,
# so the default limit holds everywhere else - #411.
FactoryBot/ExcessiveCreateList:
  Exclude:
    - "spec/requests/groups_spec.rb"

# One behavior per example still holds; the default `Max: 1` mistakes
# facets of one behavior for several behaviors. A request spec asserting
# a redirect and the side effect that earned it is one behavior in two
# expectations, and `.agents/testing.md` allows that explicitly. Four is
# the ceiling: an example needing a fifth facet either splits, or is
# unacceptable.
RSpec/MultipleExpectations:
  Max: 4
