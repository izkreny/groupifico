# Omakase Ruby styling for Rails
inherit_gem:
  rubocop-rails-omakase: rubocop.yml
  # Teaches RSpec/EmptyExampleGroup and friends about the action_policy RSpec
  # DSL (describe_rule/succeed/failed), so a policy spec is not flagged as empty.
  action_policy: config/rubocop-rspec.yml

plugins:
  - rubocop-rspec

AllCops:
  NewCops: enable

# Overwrite or add rules to create your own house style
#
# # Use `[a, [b, c]]` not `[ a, [ b, c ] ]`
# Layout/SpaceInsideArrayLiteralBrackets:
#   Enabled: false

# An inline `rubocop:disable` is itself an offense, with no exceptions:
# the cop's own `AllowedCops` default is already `[]`, so enabling it
# catches every directive that leaves this cop unnamed. A directive that
# names this cop, its department, or `all` disables it along with
# whatever it was hiding, which is why `bin/rubocop` also passes
# `--ignore-disable-comments` - that flag, together with this cop, is
# the whole gate. A cop that is wrong for this repository is
# reconfigured here instead, once, with a comment saying why.
Style/DisableCopsWithinSourceCodeDirective:
  Enabled: true

# Headroom, deliberately taken before it is needed. Inline setup is the rule
# in `.agents/testing.md`, so an example carries its own preconditions rather
# than hiding them in a `let`, and authorization makes those preconditions
# plural: reaching a record means creating the record, the group that points
# at it and the membership that reaches the group. Add the request and the
# two expectations `RSpec/MultipleExpectations: Max: 4` already allows, and
# the default `Max: 5` is spent exactly, with nothing left for the next
# precondition any of these specs grows.
#
# So this is not fixing an offense: the suite sits inside the default today.
# It is refusing to spend the next spec's inline setup on a `let`. Ten is the
# ceiling; an example longer than that is a conversation with the owner.
RSpec/ExampleLength:
  Max: 10

# Action Policy's own alias matcher takes the rule name as the subject:
# `expect(:edit?).to be_an_alias_of(policy, :show?)`, per its testing guide. The
# cop reads that bare symbol as the expected value put in the wrong place, which
# is right in general and wrong for this matcher, whose signature has no other
# form. Scoped to policy specs so the cop keeps working everywhere else.
RSpec/ExpectActual:
  Exclude:
    - "spec/policies/**/*_spec.rb"

# One behavior per example still holds; the default `Max: 1` mistakes
# facets of one behavior for several behaviors. A request spec asserting
# a redirect and the side effect that earned it is one behavior in two
# expectations, and `.agents/testing.md` allows that explicitly. Four is
# the ceiling: an example needing a fifth facet either splits, or is a
# conversation with the owner.
RSpec/MultipleExpectations:
  Max: 4
