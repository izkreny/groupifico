version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  # No labels at all. Labels belong on issues, never on pull requests, and
  # Dependabot recreates its own `dependencies` and ecosystem labels on the
  # next run unless this list is present and empty.
  labels: []
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  labels: []
