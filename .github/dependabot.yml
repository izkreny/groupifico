version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  # No labels at all: they belong on issues, never on pull requests. The
  # empty list is the documented way to say so, and GitHub's backend
  # ignores it, so Dependabot labels its pull requests anyway and those
  # labels are left alone. Kept as the correct declaration of intent.
  # `.agents/dependencies.md` has the upstream issue and the standing call.
  labels: []
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  labels: []
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  labels: []
